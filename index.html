<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cumulus | News from around the cloud</title>
  <meta name="description" content="News from around the cloud: MacRumors, 9to5Mac, MacStories and VRT NWS.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <script>
    // Pick light or dark before the page paints, following the device setting
    (function () {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      function apply() { document.documentElement.setAttribute("data-bs-theme", mq.matches ? "dark" : "light"); }
      apply();
      mq.addEventListener("change", apply);
    })();
  </script>
</head>
<body class="d-flex flex-column min-vh-100">
  <header class="site-masthead" data-bs-theme="dark">
    <nav class="container d-flex flex-wrap align-items-center justify-content-between gap-2 py-2">
      <a href="./" class="site-logo d-flex align-items-center gap-3 py-2">
        <span class="site-name" data-site="name">Cumulus</span>
        <span class="vr bg-white opacity-50"></span>
        <span class="site-tagline" data-site="tagline">News from around the cloud</span>
      </a>
      <span class="badge rounded-pill border border-secondary text-white-50 fw-normal px-3 py-2" id="updated" role="status">Checking for news…</span>
    </nav>
  </header>

  <main class="container flex-grow-1 py-4 py-lg-5">
    <p class="small text-body-secondary mb-4" id="status">Loading headlines…</p>
    <div id="grid"></div>
  </main>

  <footer class="site-footer py-4 small">
    <div class="container">
      <p class="mb-0"><span data-site="name">Cumulus</span> aggregates news from around the cloud. All content belongs to their respective owners.</p>
    </div>
  </footer>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
